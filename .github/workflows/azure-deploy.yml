name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'terraform/**'
  workflow_dispatch:

env:
  DOCKER_IMAGE_NAME: flight-tracker
  DOTNET_VERSION: '8.0.x'
  ACR_SERVER: flighttrackeracr6ebcf3aa.azurecr.io

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --filter "FullyQualifiedName!~PlaywrightUITests&FullyQualifiedName!~BookingComApiTests&FullyQualifiedName!~AmadeusApiTests"

  build-and-push-docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    environment:
      name: Prod
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Get build timestamp
        id: timestamp
        run: echo "time=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_OUTPUT

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.ACR_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:latest
          platforms: linux/amd64
          build-args: |
            GIT_COMMIT=${{ github.sha }}
            BUILD_TIME=${{ steps.timestamp.outputs.time }}

  deploy-to-azure:
    name: Deploy to Azure App Service
    runs-on: ubuntu-latest
    needs: build-and-push-docker
    environment:
      name: Prod
      url: ${{ steps.deploy.outputs.webapp-url }}
    
    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Discover Azure resources
        id: discover
        run: |
          # Hardcode for now - will fix auto-discovery later
          RG="flight-tracker-rg"
          WEBAPP="flighttracker-6ebcf3aa"
          
          echo "resource_group=$RG" >> $GITHUB_OUTPUT
          echo "webapp_name=$WEBAPP" >> $GITHUB_OUTPUT
          
          echo "✓ Using: $WEBAPP in $RG"
          echo "DEBUG - resource_group output: $RG"
          echo "DEBUG - webapp_name output: $WEBAPP"

      - name: Configure App Service settings
        run: |
          # Only update settings if secrets are provided
          # This prevents wiping out existing settings with empty values
          SETTINGS_ARGS=""
          
          if [ -n "${{ secrets.SENTRY_DSN }}" ]; then
            SETTINGS_ARGS="$SETTINGS_ARGS Sentry__Dsn=${{ secrets.SENTRY_DSN }}"
          fi
          
          if [ -n "${{ secrets.FLIGHT_PROVIDER_TYPE }}" ]; then
            SETTINGS_ARGS="$SETTINGS_ARGS FlightProvider__Type=${{ secrets.FLIGHT_PROVIDER_TYPE }}"
          fi
          
          if [ -n "${{ secrets.FLIGHT_PROVIDER_API_KEY }}" ]; then
            SETTINGS_ARGS="$SETTINGS_ARGS FlightProvider__ApiKey=${{ secrets.FLIGHT_PROVIDER_API_KEY }}"
          fi
          
          if [ -n "${{ secrets.FLIGHT_PROVIDER_API_SECRET }}" ]; then
            SETTINGS_ARGS="$SETTINGS_ARGS FlightProvider__ApiSecret=${{ secrets.FLIGHT_PROVIDER_API_SECRET }}"
          fi
          
          if [ -n "${{ secrets.FLIGHT_PROVIDER_API_HOST }}" ]; then
            SETTINGS_ARGS="$SETTINGS_ARGS FlightProvider__ApiHost=${{ secrets.FLIGHT_PROVIDER_API_HOST }}"
          fi
          
          if [ -n "${{ secrets.FLIGHT_PROVIDER_USE_PRODUCTION }}" ]; then
            SETTINGS_ARGS="$SETTINGS_ARGS FlightProvider__UseProduction=${{ secrets.FLIGHT_PROVIDER_USE_PRODUCTION }}"
          fi
          
          # Only run if we have settings to update
          if [ -n "$SETTINGS_ARGS" ]; then
            echo "Updating app settings from secrets..."
            az webapp config appsettings set \
              --name ${{ steps.discover.outputs.webapp_name }} \
              --resource-group ${{ steps.discover.outputs.resource_group }} \
              --settings $SETTINGS_ARGS
          else
            echo "No secrets configured - skipping app settings update"
            echo "App settings are managed by Terraform"
          fi

      - name: Deploy to Azure Web App
        id: deploy
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.discover.outputs.webapp_name }}
          images: ${{ env.ACR_SERVER }}/${{ env.DOCKER_IMAGE_NAME }}:latest

      - name: Restart App Service
        run: |
          az webapp restart \
            --name ${{ steps.discover.outputs.webapp_name }} \
            --resource-group ${{ steps.discover.outputs.resource_group }}
          
          echo "🚀 Deployment completed!"
          echo "🌐 App URL: https://${{ steps.discover.outputs.webapp_name }}.azurewebsites.net"

      - name: Logout from Azure
        run: az logout
        if: always()

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: [build-and-test, build-and-push-docker, deploy-to-azure]
    if: failure()
    
    steps:
      - name: Send failure notification
        run: |
          echo "❌ Deployment failed!"
          echo "Check the logs at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          # Add Slack/Teams/Email notification here if needed
